<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebGL2 PBR Material Lab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>WebGL2 PBR Material Lab</h1>
    <p id="status">booting…</p>
  </header>
  <main>
    <canvas id="gl"></canvas>
    <aside id="controls">
      <label>Albedo R <input data-key="albedo0" type="range" min="0" max="1" step="0.01" value="0.9" /></label>
      <label>Albedo G <input data-key="albedo1" type="range" min="0" max="1" step="0.01" value="0.3" /></label>
      <label>Albedo B <input data-key="albedo2" type="range" min="0" max="1" step="0.01" value="0.15" /></label>
      <label>Metallic <input data-key="metallic" type="range" min="0" max="1" step="0.01" value="0" /></label>
      <label>Roughness <input data-key="roughness" type="range" min="0.04" max="1" step="0.01" value="0.45" /></label>
      <label>Exposure <input data-key="exposure" type="range" min="0.2" max="3" step="0.01" value="1" /></label>
      <button id="btn-capture" type="button">Capture PNG</button>
      <pre id="stats"></pre>
    </aside>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
